# Same three-service shape as realtime-chat, and the same two rules that shape it:
# personalization goes through `envSecrets` (never `envVariables`, which is silently
# ignored at import level), and subdomains are enabled by zcli after the first push,
# never by a flag here.
#
# `${{{prefix}}db_hostname}` is not a typo: the outer `${...}` is Zerops' own
# cross-service reference and `{{prefix}}` is ours.
services:
  - hostname: {{prefix}}db
    type: postgresql:single@16
    priority: 3

  - hostname: {{prefix}}api
    type: nodejs@22
    priority: 2
    envSecrets:
      BOARD_TITLE: "{{boardTitle}}"
      OWNER_NAME: "{{ownerName}}"
      THEME: "{{theme}}"
      PGHOST: ${{{prefix}}db_hostname}
      PGPORT: ${{{prefix}}db_port}
      PGUSER: ${{{prefix}}db_user}
      PGPASSWORD: ${{{prefix}}db_password}
      PGDATABASE: ${{{prefix}}db_dbName}

  - hostname: {{prefix}}web
    type: static
    priority: 1
